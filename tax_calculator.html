<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>税抜計算アプリ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
    width: 100%;
    max-width: 380px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 16px;
    color: #222;
  }
  label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
  }
  input[type="number"] {
    width: 100%;
    padding: 12px;
    font-size: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .rate-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .rate-toggle button {
    flex: 1;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #f9f9f9;
    font-size: 14px;
    cursor: pointer;
  }
  .rate-toggle button.active {
    background: #2d6cdf;
    color: #fff;
    border-color: #2d6cdf;
  }
  .result {
    background: #f0f4fc;
    border-radius: 12px;
    padding: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 15px;
  }
  .row.total {
    border-top: 1px solid #d0dcf0;
    margin-top: 4px;
    padding-top: 10px;
    font-weight: bold;
    font-size: 16px;
  }
  .highlight-box {
    border: 2px solid #e02424;
    border-radius: 8px;
    padding: 4px 10px;
    margin-top: 8px;
  }
  .highlight-box .row.total {
    border-top: none;
    margin-top: 0;
    padding-top: 6px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>税込→税抜 計算</h1>
  <label for="price">税込金額（円）</label>
  <input type="number" id="price" value="6606">

  <label>消費税率</label>
  <div class="rate-toggle">
    <button id="btn10" class="active" onclick="setRate(0.10)">10%</button>
    <button id="btn8" onclick="setRate(0.08)">8%（軽減税率）</button>
  </div>

  <div class="result">
    <div class="row"><span>税込金額</span><span id="outIncl">¥6,606</span></div>
    <div class="highlight-box">
      <div class="row"><span>税抜金額</span><span id="outExcl">-</span></div>
      <div class="row total"><span>消費税額</span><span id="outTax">-</span></div>
    </div>
  </div>
</div>

<script>
let rate = 0.10;

function setRate(r) {
  rate = r;
  document.getElementById('btn10').classList.toggle('active', r === 0.10);
  document.getElementById('btn8').classList.toggle('active', r === 0.08);
  calc();
}

function calc() {
  const price = parseFloat(document.getElementById('price').value) || 0;
  const excl = Math.round(price / (1 + rate));
  const tax = price - excl;
  document.getElementById('outIncl').textContent = '¥' + price.toLocaleString();
  document.getElementById('outExcl').textContent = '¥' + excl.toLocaleString();
  document.getElementById('outTax').textContent = '¥' + tax.toLocaleString();
}

document.getElementById('price').addEventListener('input', calc);
calc();
</script>
</body>
</html>
